name: Tests
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t abs-readwise-sync:test .
      - run: docker run --rm --network none abs-readwise-sync:test --help
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.apply.yaml config --quiet
          docker compose -f compose.yaml -f compose.image.yaml config --quiet
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, docker]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test tagged image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build --build-arg "BUILD_REVISION=$GITHUB_SHA" -t "audiobookshelf-readwise-sync:$version" .
          docker run --rm --network none "audiobookshelf-readwise-sync:$version" --version
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --mount "type=bind,source=$PWD/tests,target=/tests,readonly" --entrypoint python "audiobookshelf-readwise-sync:$version" -m unittest discover -s /tests -q
      - name: Upload Docker image archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="audiobookshelf-readwise-sync-${GITHUB_REF_NAME}-linux-${IMAGE_ARCH}.tar.gz"
          docker save "audiobookshelf-readwise-sync:$version" | gzip > "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$GITHUB_REF_NAME" "$asset" "$asset.sha256" --clobber
