[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobookshelf-readwise-sync"
version = "0.1.3"
description = "Import Audiobookshelf listening sessions into Readwise Books."
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "tzdata==2026.6",
]
license = "MIT"

[project.optional-dependencies]
dev = ["ruff==0.14.3"]

[project.scripts]
abs-readwise-sync = "abs_readwise_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
