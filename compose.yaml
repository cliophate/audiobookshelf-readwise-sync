services:
  sync:
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # Preview until you explicitly include compose.apply.yaml.
    command: ["--watch"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
